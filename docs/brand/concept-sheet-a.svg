  <g>
    <circle class="bl" cx="580" cy="300" r="19"/><text class="bt" x="580" y="307">1</text>
    <circle class="bl" cx="595" cy="420" r="19"/><text class="bt" x="595" y="427">2</text>
    <circle class="bl" cx="640" cy="250" r="19"/><text class="bt" x="640" y="257">7</text>
    <circle class="bl" cx="678" cy="560" r="19"/><text class="bt" x="678" y="567">3</text>
    <circle class="bl" cx="120" cy="796" r="19"/><text class="bt" x="120" y="803">4</text>
