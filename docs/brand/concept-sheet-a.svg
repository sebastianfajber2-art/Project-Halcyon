  <line class="dim" x1="930" y1="1270" x2="930" y2="1290"/><line class="dim" x1="1168" y1="1270" x2="1168" y2="1290"/>
  <text class="dt" x="1049" y="1268" text-anchor="middle">0.46 m incl. back module</text>

  <!-- ============ TOP VIEW IN FLIGHT (head = flight direction, up) ============ -->
  <polygon class="wg" points="1981,570 2303,590 2303,716 1981,808"/>
  <polygon class="wg" points="1869,570 1547,590 1547,716 1869,808"/>
  <polygon class="wd" points="1981,590 2161,784 2133,866 1981,762"/>
  <polygon class="wd" points="1869,590 1689,784 1717,866 1869,762"/>
  <polygon class="ar ln" points="1857,590 1837,602 1825,790 1841,814 1853,642"/>
  <polygon class="ar ln" points="1993,590 2013,602 2025,790 2009,814 1997,642"/>
  <polygon class="ar ln" points="1901,830 1921,830 1917,990 1905,1014 1889,990"/>
  <polygon class="ar ln" points="1929,830 1949,830 1961,990 1945,1014 1933,990"/>
  <polygon class="ar ln" points="1869,558 1981,558 1993,630 1973,790 1949,826 1901,826 1877,790 1857,630"/>
  <polygon class="ar ln" points="1925,466 1957,498 1949,542 1901,542 1893,498"/>
  <rect x="1901" y="634" width="48" height="124" rx="10" fill="#2b3e58" stroke="#ff7a1a" stroke-width="2"/>
  <rect class="tb" x="1869" y="642" width="24" height="104" rx="6"/>
  <rect class="tb" x="1957" y="642" width="24" height="104" rx="6"/>
  <rect class="tb" x="1861" y="882" width="20" height="80" rx="5"/>
  <rect class="tb" x="1969" y="882" width="20" height="80" rx="5"/>
  <rect class="tb" x="1813" y="762" width="16" height="44" rx="4"/>
  <rect class="tb" x="2021" y="762" width="16" height="44" rx="4"/>
  <rect class="ar2 ln" x="1905" y="570" width="40" height="52" rx="4"/>
  <circle cx="1981" cy="582" r="10" class="or"/><circle cx="1869" cy="582" r="10" class="or"/>
  <path class="ex" d="M1881 750 L1881 800 M1969 750 L1969 800 M1871 966 L1871 1010 M1979 966 L1979 1010"/>
  <path d="M1925 300 L1925 420 M1910 330 L1925 300 L1940 330" stroke="#7f93ad" stroke-width="2" fill="none"/>
  <text class="dt" x="1945" y="360">flight direction</text>
  <!-- span dimension -->
  <line class="dim" x1="1547" y1="1090" x2="2303" y2="1090"/>
  <line class="dim" x1="1547" y1="1080" x2="1547" y2="1100"/><line class="dim" x1="2303" y1="1080" x2="2303" y2="1100"/>
  <text class="dt" x="1925" y="1126" text-anchor="middle">2.7 m span, turn mode · dashed: 1.6 m, speed mode (50° sweep)</text>

