  <!-- ============ LEGEND ============ -->
  <line x1="60" y1="1330" x2="2340" y2="1330" stroke="#24344b" stroke-width="2"/>
  <g class="leg">
    <text x="60" y="1378">1  Helmet: HUD, cameras, comms</text>
    <text x="60" y="1420">2  HANS collar, locks helmet to frame</text>
    <text x="60" y="1462">3  Faceted carbon armor, status light</text>
    <text x="640" y="1378">4  Arm thrusters 2 × 120 N (steering)</text>
    <text x="640" y="1420">5  Back turbines 2 × 550 N (cruise)</text>
    <text x="640" y="1462">6  Crash-safe fuel cell, 40–100 L</text>
    <text x="1240" y="1378">7  Swing wings: stowed / turn / speed / stop</text>
    <text x="1240" y="1420">8  Hip actuators (exoskeleton)</text>
    <text x="1240" y="1462">9  EXO-01 knee actuators, 164 N·m</text>
    <text x="1880" y="1378">10  Leg turbines 2 × 550 N (lift)</text>
    <text x="1880" y="1420">11  Ballistic parachute</text>
    <text x="1880" y="1462">12  Grips: throttle, mode, red button</text>
