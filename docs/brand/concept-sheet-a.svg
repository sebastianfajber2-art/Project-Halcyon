<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1480" width="2400" height="1480" font-family="Segoe UI, Arial, sans-serif">
  <!-- Project Halcyon concept sheet A. Scale ~520 px per metre in all three views. -->
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#132033" stroke-width="1"/>
    </pattern>
    <style>
      .ln { stroke: #cfe0f5; stroke-width: 2; stroke-linejoin: miter; }
      .ar { fill: #1d2a3d; }
      .ar2 { fill: #24344b; }
      .wg { fill: #3d8bff; fill-opacity: 0.85; stroke: #9cc4ff; stroke-width: 2; }
      .wd { fill: none; stroke: #9cc4ff; stroke-width: 2; stroke-dasharray: 10 8; }
      .tb { fill: #5b6f88; stroke: #cfe0f5; stroke-width: 2; }
      .or { fill: #ff7a1a; }
      .ors { fill: none; stroke: #ff7a1a; stroke-width: 4; }
      .vz { fill: #4f97ff; }
      .ld { stroke: #7f93ad; stroke-width: 1.5; fill: none; }
      .bl { fill: #0d1420; stroke: #cfe0f5; stroke-width: 2; }
      .bt { fill: #e9eff7; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .lab { fill: #8fa3bd; font-size: 22px; letter-spacing: 2px; }
      .leg { fill: #cfe0f5; font-size: 21px; }
      .dim { stroke: #7f93ad; stroke-width: 1.5; }
      .dt { fill: #8fa3bd; font-size: 20px; }
      .ex { stroke: #ff9d57; stroke-width: 3; stroke-dasharray: 6 8; fill: none; }
    </style>
  </defs>

  <rect width="2400" height="1480" fill="#0d1420"/>
  <rect width="2400" height="1480" fill="url(#grid)"/>

  <text x="60" y="78" fill="#e9eff7" font-size="44" font-weight="700" letter-spacing="4">PROJECT HALCYON</text>
  <text x="530" y="78" fill="#8fa3bd" font-size="30">Concept sheet A</text>
  <text x="60" y="120" fill="#8fa3bd" font-size="22">Flight configuration, 177 kg incl. pilot · 2,440 N thrust · span 2.7 m (turn) / 1.6 m (speed) · illustration, not for manufacture</text>
  <line x1="60" y1="150" x2="2340" y2="150" stroke="#24344b" stroke-width="2"/>

  <text x="230" y="205" class="lab">FRONT · STANDING, WINGS STOWED</text>
  <text x="925" y="205" class="lab">SIDE · STANDING</text>
  <text x="1640" y="205" class="lab">TOP · IN FLIGHT, TURN MODE</text>

