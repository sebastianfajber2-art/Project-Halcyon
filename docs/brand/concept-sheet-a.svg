  <circle cx="340" cy="748" r="22" class="ar2 ln"/><circle cx="340" cy="748" r="10" class="or"/>
  <circle cx="460" cy="748" r="22" class="ar2 ln"/><circle cx="460" cy="748" r="10" class="or"/>
  <circle cx="340" cy="964" r="28" class="ar2 ln"/><circle cx="340" cy="964" r="28" class="ors"/>
  <circle cx="460" cy="964" r="28" class="ar2 ln"/><circle cx="460" cy="964" r="28" class="ors"/>

