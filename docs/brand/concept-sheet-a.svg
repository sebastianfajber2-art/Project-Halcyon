  <!-- legs -->
  <polygon class="ar ln" points="316,740 392,740 382,942 330,942"/>
  <polygon class="ar ln" points="484,740 408,740 418,942 470,942"/>
  <polygon class="ar2 ln" points="330,986 382,986 372,1170 340,1170"/>
  <polygon class="ar2 ln" points="470,986 418,986 428,1170 460,1170"/>
  <polygon class="ar ln" points="326,1172 386,1172 398,1230 308,1230"/>
  <polygon class="ar ln" points="474,1172 414,1172 402,1230 492,1230"/>
