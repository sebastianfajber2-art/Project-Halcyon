    <circle class="bl" cx="678" cy="964" r="19"/><text class="bt" x="678" y="971">9</text>
    <circle class="bl" cx="862" cy="590" r="19"/><text class="bt" x="862" y="597">5</text>
    <circle class="bl" cx="862" cy="660" r="19"/><text class="bt" x="862" y="667">6</text>
    <circle class="bl" cx="862" cy="442" r="19"/><text class="bt" x="862" y="449">11</text>
    <circle class="bl" cx="862" cy="360" r="19"/><text class="bt" x="862" y="367">7</text>
    <circle class="bl" cx="1248" cy="964" r="19"/><text class="bt" x="1248" y="971">9</text>
    <circle class="bl" cx="942" cy="1086" r="19"/><text class="bt" x="942" y="1093">10</text>
    <circle class="bl" cx="1248" cy="250" r="19"/><text class="bt" x="1248" y="257">1</text>
    <circle class="bl" cx="2296" cy="502" r="19"/><text class="bt" x="2296" y="509">7</text>
