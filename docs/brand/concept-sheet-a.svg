  <polygon class="ar2 ln" points="262,462 206,470 190,522 232,542 282,520"/>
  <polygon class="ar2 ln" points="538,462 594,470 610,522 568,542 518,520"/>

  <!-- torso -->
  <polygon class="ar ln" points="330,430 470,430 540,462 520,560 480,640 440,690 360,690 320,640 280,560 260,462"/>
  <polyline class="ln" fill="none" points="330,430 400,500 470,430"/>
  <polyline class="ln" fill="none" points="280,560 400,600 520,560"/>
  <line class="ln" x1="400" y1="500" x2="400" y2="690"/>
  <polygon class="or" points="400,516 418,546 400,576 382,546"/>

