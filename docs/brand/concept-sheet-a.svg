  <polygon class="wg" points="302,456 262,250 290,242 332,440"/>
  <polygon class="wg" points="498,456 538,250 510,242 468,440"/>
  <!-- back turbines peeking over the shoulders -->
  <rect class="tb" x="338" y="404" width="30" height="40" rx="6"/>
  <rect class="tb" x="432" y="404" width="30" height="40" rx="6"/>

  <!-- arms (left side of drawing = suit's right) -->
  <polygon class="ar ln" points="210,520 256,526 250,690 205,690"/>
  <polygon class="ar2 ln" points="205,696 250,696 240,870 200,870"/>
  <rect class="tb" x="166" y="742" width="34" height="108" rx="8"/>
