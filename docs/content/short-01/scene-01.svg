<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#132033" stroke-width="1"/></pattern>
    <radialGradient id="heat"><stop offset="0" stop-color="#ff4a36" stop-opacity="0.75"/><stop offset="1" stop-color="#ff4a36" stop-opacity="0"/></radialGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="#0d1420"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <text x="540" y="250" text-anchor="middle" fill="#8fa3bd" font-size="34" letter-spacing="4">PROJECT HALCYON</text>
  <circle cx="540" cy="800" r="430" fill="url(#heat)"/>
  <circle cx="540" cy="800" r="250" fill="none" stroke="#9cc4ff" stroke-width="34" filter="url(#glow)"/>
  <circle cx="540" cy="800" r="250" fill="none" stroke="#dff0ff" stroke-width="10"/>
  <polygon points="540,640 680,885 400,885" fill="none" stroke="#dff0ff" stroke-width="16" filter="url(#glow)"/>
  <circle cx="540" cy="800" r="70" fill="#dff0ff" filter="url(#glow)"/>
  <text x="540" y="1290" text-anchor="middle" fill="#e9eff7" font-size="92" font-weight="700" letter-spacing="4">IT WOULD</text>
  <text x="540" y="1400" text-anchor="middle" fill="#ff7a1a" font-size="88" font-weight="800" letter-spacing="2">COOK HIM ALIVE</text>

</svg>
